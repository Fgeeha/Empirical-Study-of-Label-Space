[project]
name = "plant-disease-eccv2026"
version = "0.1.0"
description = ""
authors = [
    {name = "nkolesnikov",email = "33605615+Fgeeha@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch (>=2.5.1,<3.0.0)",
    "torchvision (>=0.20.1,<0.30.0)",
    "rapidfuzz (>=3.14.3,<4.0.0)",
    "sentence-transformers (>=5.2.2,<6.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "numpy (>=1.26,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "supplemental"


[[tool.poetry.source]]
name = "PyPI"
priority = "primary"


[tool.poetry.dependencies]
torch = {source = "pytorch-cu128"}
torchvision = {source = "pytorch-cu128"}

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]

[project.optional-dependencies]
edge-bench = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.2.1",
    "websockets>=12.0",
]

# TFLite dependencies (use separate venv due to TF/PyTorch conflicts)
# Install: python3.10 -m venv venv-tflite && venv-tflite/bin/pip install -r requirements_tflite.txt
tflite = [
    "tensorflow>=2.15.0,<2.16.0",
    "numpy>=1.26.0,<2.0.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.5.0",
]

# =============================================================
# Ruff — single source of truth
# =============================================================

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true

# -------------------------------------------------------------
# Lint rules
# -------------------------------------------------------------
[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "B",
  "C4",
  "UP",
  "I",
  "C90",
]

ignore = [
  "E501",
  "B008",
  "B904",
  "Q000", # конфликтует с ruff-format
  "Q003", # конфликтует с ruff-format
  "B905",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

# -------------------------------------------------------------
# Import sorting (ex-isort)
# -------------------------------------------------------------
[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

# -------------------------------------------------------------
# Formatter (ex-Black)
# -------------------------------------------------------------
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

# -------------------------------------------------------------
# Per-file ignores (ПРАВИЛЬНАЯ СЕКЦИЯ)
# -------------------------------------------------------------
#[tool.ruff.lint.per-file-ignores]
#"*/migrations/*.py" = ["E501", "I001"]
#"config/settings.py" = ["F401"]
[tool.poetry]
package-mode = false
